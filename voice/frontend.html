<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Support — Voice Agent</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: #e2e8f0;
  }

  .card {
    width: 420px;
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 12px;
    padding: 36px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .header {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #f1f5f9;
    letter-spacing: -0.02em;
  }

  .header p {
    font-size: 12px;
    color: #64748b;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #94a3b8;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #374151;
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .dot.idle     { background: #374151; }
  .dot.ringing  { background: #f59e0b; animation: pulse 1s infinite; }
  .dot.live     { background: #22c55e; }
  .dot.speaking { background: #3b82f6; animation: pulse 0.8s infinite; }
  .dot.thinking { background: #a78bfa; animation: pulse 0.5s infinite; }
  .dot.error    { background: #ef4444; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .transcript-box {
    background: #0f1117;
    border: 1px solid #1e2235;
    border-radius: 8px;
    padding: 14px 16px;
    min-height: 160px;
    max-height: 240px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .transcript-empty {
    color: #374151;
    font-style: italic;
    margin: auto;
    text-align: center;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .msg.caller  { align-items: flex-end; }
  .msg.agent   { align-items: flex-start; }

  .msg-label {
    font-size: 10px;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .msg-bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
  .msg.caller .msg-bubble {
    background: #1e3a5f;
    color: #93c5fd;
    border-bottom-right-radius: 2px;
  }
  .msg.agent .msg-bubble {
    background: #1e2d1e;
    color: #86efac;
    border-bottom-left-radius: 2px;
  }

  .call-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: -0.01em;
  }

  .call-btn.start {
    background: #22c55e;
    color: #052e16;
  }
  .call-btn.start:hover { background: #16a34a; }

  .call-btn.end {
    background: #ef4444;
    color: #fff;
  }
  .call-btn.end:hover { background: #dc2626; }

  .call-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .config {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .config label {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .config input {
    background: #0f1117;
    border: 1px solid #2d3148;
    border-radius: 6px;
    padding: 8px 12px;
    color: #e2e8f0;
    font-family: inherit;
    font-size: 13px;
    width: 100%;
    outline: none;
  }
  .config input:focus { border-color: #4f6ef7; }
  .config input::placeholder { color: #374151; }

  .footer {
    font-size: 11px;
    color: #374151;
    text-align: center;
  }
  .footer span { color: #4f6ef7; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Bank Support</h1>
    <p>Voice agent demo — all 5 production layers</p>
  </div>

  <div class="config">
    <label>LiveKit token URL (your backend endpoint)</label>
    <input id="tokenUrl" type="text"
      placeholder="http://localhost:8080/token"
      value="http://localhost:8080/token" />
  </div>

  <div class="status-row">
    <div class="dot idle" id="dot"></div>
    <span id="statusText">Ready to connect</span>
  </div>

  <div class="transcript-box" id="transcript">
    <div class="transcript-empty" id="emptyState">
      Start a call to see the transcript
    </div>
  </div>

  <button class="call-btn start" id="callBtn" onclick="toggleCall()">
    📞 Start Call
  </button>

  <div class="footer">
    STT: <span>Deepgram Nova-3</span> &nbsp;·&nbsp;
    TTS: <span>ElevenLabs Flash</span> &nbsp;·&nbsp;
    LLM: <span>Qwen2.5-72B</span>
  </div>
</div>

<script>
let room = null;
let connected = false;

function setStatus(state, text) {
  document.getElementById('dot').className = `dot ${state}`;
  document.getElementById('statusText').textContent = text;
}

function addMessage(role, text) {
  const box = document.getElementById('transcript');
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  msg.innerHTML = `
    <div class="msg-label">${role === 'caller' ? 'You' : 'Agent'}</div>
    <div class="msg-bubble">${text}</div>
  `;
  box.appendChild(msg);
  box.scrollTop = box.scrollHeight;
}

async function toggleCall() {
  if (connected) {
    await endCall();
  } else {
    await startCall();
  }
}

async function startCall() {
  const btn = document.getElementById('callBtn');
  btn.disabled = true;
  setStatus('ringing', 'Connecting...');

  try {
    // Fetch a LiveKit participant token from our local token server
    const tokenUrl = document.getElementById('tokenUrl').value;
    const res = await fetch(tokenUrl);
    if (!res.ok) throw new Error(`Token server returned ${res.status}`);
    const { token, url } = await res.json();

    room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true,
    });

    // Track agent speaking state for the status dot
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === LivekitClient.Track.Kind.Audio) {
        setStatus('live', 'Connected — agent is listening');
      }
    });

    // Transcription events — LiveKit Agents surfaces these
    room.on(LivekitClient.RoomEvent.TranscriptionReceived, (segments, participant) => {
      for (const seg of segments) {
        if (seg.final) {
          const isAgent = participant?.isAgent ?? false;
          addMessage(isAgent ? 'agent' : 'caller', seg.text);
          setStatus(
            isAgent ? 'speaking' : 'live',
            isAgent ? 'Agent speaking...' : 'You speaking...'
          );
        }
      }
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      setStatus('idle', 'Call ended');
      connected = false;
      btn.textContent = '📞 Start Call';
      btn.className = 'call-btn start';
      btn.disabled = false;
    });

    // Connect and publish local microphone
    await room.connect(url, token);
    await room.localParticipant.setMicrophoneEnabled(true);

    connected = true;
    btn.textContent = '📵 End Call';
    btn.className = 'call-btn end';
    btn.disabled = false;
    setStatus('live', 'Connected — speak now');

  } catch (err) {
    console.error('Connection failed:', err);
    setStatus('error', `Error: ${err.message}`);
    btn.disabled = false;
  }
}

async function endCall() {
  if (room) {
    await room.disconnect();
    room = null;
  }
  connected = false;
  const btn = document.getElementById('callBtn');
  btn.textContent = '📞 Start Call';
  btn.className = 'call-btn start';
  btn.disabled = false;
  setStatus('idle', 'Call ended');
}
</script>
</body>
</html>
